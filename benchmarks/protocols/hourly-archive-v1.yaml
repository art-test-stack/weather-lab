station_identity:
  rule: Named national stations from the official hourly files; retain five-digit aliases and national IDs separately.
  forecast_coordinates: Query the actual hourly observation coordinates; record the returned model grid separately.
  differences_from_frozen_synop: Brest and Orly hourly coordinates differ by 1.875 km and 0.938 km respectively; this is a new dataset, not a replacement extraction for the old suite.
  history: Preserve coordinate changes per observation; verify historical source positions before selecting cases.
observations:
  source: https://www.data.gouv.fr/datasets/donnees-climatologiques-de-base-horaires
  fields: [t, pmer, ff, dd, u, v]
  accepted_quality_codes: [0, 1]
  other_quality_codes: Mask modelling values; retain original values and flags.
  missing_samples: Keep hourly gaps; never interpolate verification targets.
  availability: Original publication and revision times absent; a causal replay assumption is still required before benchmarking.
products: [meteofrance_arome_france, meteofrance_arome_france_hd]
historical_forecasts:
  endpoint: https://historical-forecast-api.open-meteo.com/v1/forecast
  source_kind: stitched_historical_forecast
  fields: [temperature_2m, pressure_msl]
  units: {temperature_2m: '°C', pressure_msl: hPa}
  cell_selection: nearest
  elevation: nan
  source_role: Historical series inventory; not a complete issued-run future covariate or a 24/48-hour efficacy test.
  missing_fields: Retain nulls, including missing HD sea-level pressure; never substitute another product.
  provenance: Separate station/product response hashes, requested coordinates and returned grid coordinates.
