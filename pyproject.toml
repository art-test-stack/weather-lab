[project]
name = "weather-lab"
version = "0.1.0"
description = "Timestral Weather Lab: a reproducible station-level probabilistic forecasting benchmark (Météo-France SYNOP, AROME) with a Gradio explorer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "eccodes>=2.50.0",
    "eccodeslib>=2.50.0.33",
    "gradio>=6.30.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "timestral",
    "torch>=2.4",
]

[project.scripts]
weather-lab = "weather_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_lab"]

[tool.uv.sources]
# Pinned to the inspected upstream commit ("Timestral release", 2026-10-15).
timestral = { git = "https://github.com/mistralai/timestral", rev = "a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_model: downloads Timestral weights and runs real inference (opt-in: -m real_model)"]
addopts = "-m 'not real_model'"
