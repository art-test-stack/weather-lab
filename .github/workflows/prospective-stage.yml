name: Prospective evaluation stage

on:
  workflow_call:
    inputs:
      stage: {required: true, type: string}
      mode: {required: true, type: string}
      start: {default: '', type: string}
      end: {default: '', type: string}
      allow_large_downloads: {default: false, type: boolean}
    secrets:
      HF_TOKEN: {required: true}
      METEOFRANCE_TOKEN: {required: false}
      METEOFRANCE_APPLICATION_ID: {required: false}

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      METEOFRANCE_TOKEN: ${{ secrets.METEOFRANCE_TOKEN }}
      METEOFRANCE_APPLICATION_ID: ${{ secrets.METEOFRANCE_APPLICATION_ID }}
      STAGE: ${{ inputs.stage }}
      MODE: ${{ inputs.mode }}
      START: ${{ inputs.start }}
      END: ${{ inputs.end }}
      ALLOW_LARGE: ${{ inputs.allow_large_downloads }}
      WEATHER_LAB_MAX_LOADED_MODELS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.11.28'
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Reuse pinned checkpoint and retrieval files
        if: inputs.stage == 'inference' || inputs.mode == 'setup'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4
        with:
          path: |
            ~/.cache/huggingface/hub
            data/cache/rag
          key: prospective-models-v1-${{ hashFiles('uv.lock', 'src/weather_lab/models.py', 'configs/hourly_matrix*.yaml') }}
      - name: Run explicit stage with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          args=(--remote --serialized-writer)
          dates=()
          if [[ -n "$START" ]]; then dates+=(--start "$START"); fi
          if [[ -n "$END" ]]; then dates+=(--end "$END"); fi
          setup=()
          if [[ "$ALLOW_LARGE" == true ]]; then setup+=(--allow-large-downloads); fi
          run_stage() {
            local action="$1"
            shift
            for attempt in 1 2 3; do
              if uv run --frozen weather-lab prospective "$action" "${args[@]}" "$@"; then return 0; fi
              if [[ "$attempt" == 3 ]]; then return 1; fi
              sleep 30
            done
          }
          if [[ "$STAGE" == collect ]]; then
            case "$MODE" in
              setup)
                run_stage catalog "${setup[@]}"
                run_stage models "${setup[@]}"
                run_stage observations --start "${START:-$(date -u -d '90 days ago' +%F)}"
                run_stage realtime
                ;;
              cycle)
                run_stage realtime
                run_stage forecasts "${dates[@]}"
                ;;
              observations) run_stage observations "${dates[@]}" ;;
              backfill) run_stage backfill "${dates[@]}" "${setup[@]}" ;;
              score) run_stage sync ;;
              *) exit 2 ;;
            esac
          elif [[ "$STAGE" == inference ]]; then
            run_stage catalog "${setup[@]}"
            run_stage models "${setup[@]}"
            if [[ "$MODE" == backfill ]]; then
              run_stage infer "${dates[@]}" --retrospective
            else
              run_stage infer "${dates[@]}"
            fi
          elif [[ "$STAGE" == scoring ]]; then
            run_stage score
          else
            exit 2
          fi
