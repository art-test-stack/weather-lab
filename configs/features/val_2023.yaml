# Feature-group validation on 2023 (chronological validation; test 2024 is not loaded or scored).
# Timestral-209M, 30-day context, calendar inputs; one feature group added at a time
# (src/weather_lab/features.py). Rule: configs/features/selection_rule.yaml.
suite: synop-ctxval-2023-v1
variant: validation
label: feature-group validation (2023 only)
manifest: benchmarks/manifests/synop-ctxval-2023-v1.json
paths:
  raw: data/raw
  processed: data/processed
  runs: runs
data:
  years:
  - 2018
  - 2019
  - 2020
  - 2021
  - 2022
  - 2023
  stations:
  - '07630'
  - 07149
  - '07110'
  - 07190
  - 07690
splits:
  fit:
  - 2018-01-01T00:00Z
  - 2022-12-31T21:00Z
  validation:
  - 2023-01-01T00:00Z
  - 2023-12-31T21:00Z
origins:
  rule: daily
  hour_utc: 0
  splits:
  - validation
forecast:
  step_hours: 3
  horizon_steps: 16
  context_days: 90
  highlight_leads_h:
  - 6
  - 24
  - 48
eligibility:
  variable: t
  min_context_observed_fraction: 0.8
  require_observation_within_hours: 24
  windows_days:
  - 7
  - 30
  - 90
variables:
- t
- pmer
- u
- v
models:
- {id: persistence, kind: persistence}
- {id: timestral-209m-mv-cal-ctx30, kind: timestral, targets: [t, pmer, u, v], calendar: true, context_days: 30, checkpoint: mistralai/Timestral-209M, revision: 9874d252ab0aae16f7f7c999f98f98d6ad7d8365}
- {id: timestral-209m-mv-cal-ctx30-f-atmos, kind: timestral, targets: [t, pmer, u, v], calendar: true, context_days: 30,
   features: [atmos], checkpoint: mistralai/Timestral-209M, revision: 9874d252ab0aae16f7f7c999f98f98d6ad7d8365}
- {id: timestral-209m-mv-cal-ctx30-f-solar, kind: timestral, targets: [t, pmer, u, v], calendar: true, context_days: 30,
   features: [solar], checkpoint: mistralai/Timestral-209M, revision: 9874d252ab0aae16f7f7c999f98f98d6ad7d8365}
- {id: timestral-209m-mv-cal-ctx30-f-tend, kind: timestral, targets: [t, pmer, u, v], calendar: true, context_days: 30,
   features: [tend], checkpoint: mistralai/Timestral-209M, revision: 9874d252ab0aae16f7f7c999f98f98d6ad7d8365}
paired_comparisons:
- [timestral-209m-mv-cal-ctx30-f-atmos, timestral-209m-mv-cal-ctx30]
- [timestral-209m-mv-cal-ctx30-f-solar, timestral-209m-mv-cal-ctx30]
- [timestral-209m-mv-cal-ctx30-f-tend, timestral-209m-mv-cal-ctx30]
timestral:
  checkpoint: mistralai/Timestral-28M
  revision: 49b26409ac87b5935539a5d8ffe7f397b720db47
  batch_size: 32
  max_concurrent: 1
experiment: features-val-v1
