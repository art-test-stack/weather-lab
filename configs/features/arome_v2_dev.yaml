# Context-enrichment feature pilot on the frozen arome-issued-v2 cases: DEVELOPMENT DIAGNOSTICS ONLY.
# These 12 autumn days have been inspected repeatedly, so nothing here selects features or supports a
# claim. Selection happens on 2023 validation (configs/features/val_2023.yaml); final evaluation on the
# untouched 2025 test (configs/features/test_2025.yaml). Checkpoint (209M), context (30 days), calendar
# inputs, AROME setup (archived) and preprocessing are fixed; only the feature groups change
# (src/weather_lab/features.py). Adds a bias-corrected AROME reference built from the same available
# AROME errors. Run with `evaluate --reuse <matrix run>` so the 12 matrix systems are copied (verified).
suite: arome-issued-v2
variant: smoke
experiment: features-dev-v1
label: "integration study (14-day archive): context-enrichment feature pilot (development only)"
manifest: benchmarks/manifests/arome-issued-v2.json

paths:
  raw: data/raw
  processed: data/processed
  runs: runs

data:
  years: [2022, 2023, 2024, 2026]   # 2022-2024 fit baselines; 2026 supplies history + verifying obs
  stations: ["07630", "07149", "07110", "07190", "07690"]

splits:
  fit: ["2022-01-01T00:00Z", "2024-12-31T21:00Z"]
  test: ["2026-10-10T00:00Z", "2026-10-23T21:00Z"]

origins:
  rule: explicit
  hour_utc: 6
  dates: ["2026-10-10", "2026-10-11", "2026-10-12", "2026-10-13", "2026-10-14", "2026-10-15",
          "2026-10-16", "2026-10-17", "2026-10-18", "2026-10-19", "2026-10-20", "2026-10-21"]
  splits: [test]

forecast:
  step_hours: 3
  horizon_steps: 16
  context_days: 30
  highlight_leads_h: [6, 24, 48]

eligibility:
  variable: t
  min_context_observed_fraction: 0.8
  require_observation_within_hours: 24

variables: [t, pmer, u, v]

arome:
  # AROME 0.025 deg (EURW1S40) SP1 package: holds T2m and MSLP (the 0.01 deg SP packages carry no MSLP).
  base_url: https://meteofrance-pnt.s3.rbx.io.cloud.ovh.net/pnt
  grid: "0025"
  package: SP1
  constant_url: https://static.data.gouv.fr/resources/champs-constant-1/20250217-090702/constant-eurw1s40.grib2
  run_hour_utc: 3          # run used for a 06 UTC origin
  max_lead_h: 51           # do not extrapolate beyond this
  fields: [t, pmer]        # 2 m temperature, mean-sea-level pressure
  # A run qualifies only if every needed file's archive Last-Modified time is <= origin.
  availability_rule: archive_last_modified

models:
  - {id: persistence, kind: persistence}
  - {id: seasonal-naive-24h, kind: seasonal_naive}
  - {id: climatology, kind: climatology, window_days: 15, min_samples: 20}
  - {id: arome-raw, kind: arome}
  # (A) no AROME input
  - {id: timestral-28m-mv-cal, kind: timestral, targets: [t, pmer, u, v], calendar: true}
  # (B) issued AROME over the horizon, historical segment all missing
  - {id: timestral-28m-mv-cal-arome-futureonly, kind: timestral, targets: [t, pmer, u, v], calendar: true, arome: missing}
  # (C) issued AROME over the horizon + archived AROME forecasts over the history (missing where none qualifies)
  - {id: timestral-28m-mv-cal-arome-archived, kind: timestral, targets: [t, pmer, u, v], calendar: true, arome: archived}
  # v1 behaviour, explicitly labelled: station observations substituted for historical AROME
  - {id: timestral-28m-mv-cal-arome-substobs, kind: timestral, targets: [t, pmer, u, v], calendar: true, arome: substituted_observations}
  # Larger checkpoint (837 MB), same inputs as the 28M variants above
  - {id: timestral-209m-mv-cal, kind: timestral, targets: [t, pmer, u, v], calendar: true,
     checkpoint: mistralai/Timestral-209M, revision: 9874d252ab0aae16f7f7c999f98f98d6ad7d8365}
  - {id: timestral-209m-mv-cal-arome-archived, kind: timestral, targets: [t, pmer, u, v], calendar: true, arome: archived,
     checkpoint: mistralai/Timestral-209M, revision: 9874d252ab0aae16f7f7c999f98f98d6ad7d8365}

  # Added in matrix-v1: the remaining input setups for the larger checkpoint
  - {id: timestral-209m-mv-cal-arome-substobs, kind: timestral, targets: [t, pmer, u, v], calendar: true,
     arome: substituted_observations,
     checkpoint: mistralai/Timestral-209M, revision: 9874d252ab0aae16f7f7c999f98f98d6ad7d8365}
  # Diagnostic: issued AROME over the horizon, historical segment all missing
  - {id: timestral-209m-mv-cal-arome-futureonly, kind: timestral, targets: [t, pmer, u, v], calendar: true, arome: missing,
     checkpoint: mistralai/Timestral-209M, revision: 9874d252ab0aae16f7f7c999f98f98d6ad7d8365}

# Matched comparisons (model, reference): only the checkpoint differs within a pair. Scored as paired
# differences with the suite's block bootstrap (intervals only with enough blocks).
  # features-dev-v1: AROME reference built from the same available errors (point only, no tuning)
  - {id: arome-biascorr, kind: arome_biascorr, window_days: 7, shrink_k: 5}
  # 209M + archived AROME, one feature group added at a time (nothing else changes)
  - {id: timestral-209m-mv-cal-arome-archived-f-resid, kind: timestral, targets: [t, pmer, u, v], calendar: true,
     arome: archived, features: [resid], checkpoint: mistralai/Timestral-209M, revision: 9874d252ab0aae16f7f7c999f98f98d6ad7d8365}
  - {id: timestral-209m-mv-cal-arome-archived-f-atmos, kind: timestral, targets: [t, pmer, u, v], calendar: true,
     arome: archived, features: [atmos], checkpoint: mistralai/Timestral-209M, revision: 9874d252ab0aae16f7f7c999f98f98d6ad7d8365}
  - {id: timestral-209m-mv-cal-arome-archived-f-solar, kind: timestral, targets: [t, pmer, u, v], calendar: true,
     arome: archived, features: [solar], checkpoint: mistralai/Timestral-209M, revision: 9874d252ab0aae16f7f7c999f98f98d6ad7d8365}
  - {id: timestral-209m-mv-cal-arome-archived-f-tend, kind: timestral, targets: [t, pmer, u, v], calendar: true,
     arome: archived, features: [tend], checkpoint: mistralai/Timestral-209M, revision: 9874d252ab0aae16f7f7c999f98f98d6ad7d8365}

paired_comparisons:
  - [timestral-209m-mv-cal-arome-archived-f-resid, timestral-209m-mv-cal-arome-archived]
  - [timestral-209m-mv-cal-arome-archived-f-atmos, timestral-209m-mv-cal-arome-archived]
  - [timestral-209m-mv-cal-arome-archived-f-solar, timestral-209m-mv-cal-arome-archived]
  - [timestral-209m-mv-cal-arome-archived-f-tend, timestral-209m-mv-cal-arome-archived]
  - [arome-biascorr, arome-raw]
  - [timestral-209m-mv-cal, timestral-28m-mv-cal]
  - [timestral-209m-mv-cal-arome-archived, timestral-28m-mv-cal-arome-archived]
  - [timestral-209m-mv-cal-arome-substobs, timestral-28m-mv-cal-arome-substobs]
  - [timestral-209m-mv-cal-arome-futureonly, timestral-28m-mv-cal-arome-futureonly]
  - [timestral-28m-mv-cal-arome-archived, timestral-28m-mv-cal]
  - [timestral-209m-mv-cal-arome-archived, timestral-209m-mv-cal]
  - [timestral-28m-mv-cal-arome-archived, arome-raw]
  - [timestral-209m-mv-cal-arome-archived, arome-raw]

timestral:
  checkpoint: mistralai/Timestral-28M
  revision: 49b26409ac87b5935539a5d8ffe7f397b720db47
  batch_size: 32
  max_concurrent: 1
