# Full historical benchmark (NOT run during initialization).
# Requires downloading SYNOP 2018-2024 (~7 MB per year). Run `data fetch` first.
suite: synop-historical-v1
variant: full
label: "benchmark"
manifest: benchmarks/manifests/synop-historical-v1.full.json

paths:
  raw: data/raw
  processed: data/processed
  runs: runs

data:
  years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]
  # Toulouse, Paris-Orly, Brest, Strasbourg, Nice
  stations: ["07630", "07149", "07110", "07190", "07690"]

splits:
  fit: ["2018-01-01T00:00Z", "2022-12-31T21:00Z"]
  validation: ["2023-01-01T00:00Z", "2023-12-31T21:00Z"]
  test: ["2024-01-01T00:00Z", "2024-12-31T21:00Z"]

origins:
  rule: daily
  hour_utc: 0
  splits: [validation, test]   # model/context choices use validation only

forecast:
  step_hours: 3
  horizon_steps: 16
  context_days: 30
  highlight_leads_h: [6, 24, 48]

eligibility:
  variable: t
  min_context_observed_fraction: 0.8
  require_observation_within_hours: 24

variables: [t, pmer, u, v]

models:
  - {id: persistence, kind: persistence}
  - {id: seasonal-naive-24h, kind: seasonal_naive}
  - {id: climatology, kind: climatology, window_days: 15, min_samples: 20}
  - {id: timestral-28m-t, kind: timestral, targets: [t]}
  - {id: timestral-28m-mv, kind: timestral, targets: [t, pmer, u, v]}
  - {id: timestral-28m-mv-cal, kind: timestral, targets: [t, pmer, u, v], calendar: true}
  # Size comparison (validation first): 837 MB checkpoint, downloaded on demand.
  # - {id: timestral-209m-mv-cal, kind: timestral, targets: [t, pmer, u, v], calendar: true,
  #    checkpoint: mistralai/Timestral-209M, revision: 9874d252ab0aae16f7f7c999f98f98d6ad7d8365}
  # Context comparison: same model with context_days: 7 / 90 via a per-model override.
  # - {id: timestral-28m-mv-cal-ctx90, kind: timestral, targets: [t, pmer, u, v], calendar: true, context_days: 90}

timestral:
  checkpoint: mistralai/Timestral-28M
  revision: 49b26409ac87b5935539a5d8ffe7f397b720db47
  batch_size: 32
  max_concurrent: 1
