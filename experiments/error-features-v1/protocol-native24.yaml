experiment: error-features-native24-v1
version: 1
parent_protocol: experiments/error-features-v1/protocol.yaml
design: Inherit the fixed model, data, features, replay availability and extraction rules; change only native forecast horizon.
purpose: User-requested 90-day context with a native 24-hour forecast; not a slice of 48-hour model output.
context_days: 90
horizon_hours: 24
step_hours: 3
native_prediction_steps: 8
models: [Timestral-209M, t0-gamma]
arms: [existing, past-wind, issued-atmosphere, both]
identities: Every foundation-model candidate has an explicit h24 identifier, separate from h48.
cases: Same 55 inspected October development cases; retain the common maximum-horizon input-eligibility set.
comparators: Raw and existing bias-corrected AROME, exact leads 3-24; their deterministic per-lead outputs are horizon-independent.
prior_24h_reports: Slices of native 48-hour inference; preserve and label separately, never relabel as native24.
selection: None; no confirmation or model promotion.
metrics: Station-balanced median/point MAE, micro-MAE, RMSE, bias, pinball, coverage and width; separate temperature and pressure.
budget:
  programme_cpu_cap_minutes: 60
  wave_cpu_cap_seconds: 720
  timestral_cpu_cap_seconds: 480
  t0_cpu_cap_seconds: 180
  preparation_and_reporting_cpu_seconds: 60
  pilot_cases: 5
  concurrent_heavy_jobs: 1
  new_downloads: false
limits: Sparse residual history and eleven dependent days remain development limitations; the large historical benchmark is not completed by this experiment.
