experiment: error-features-v1
version: 1
purpose: User-requested incremental information screen on inspected October development data.
selection: None; no promotion or confirmation claim.
cases: Same 55 October 11-21 origins across five stations as platform-error-check-v1.
context_days: 90
horizon_hours: 48
step_hours: 3
prediction_target: observation minus latest qualifying archived AROME
conditioning: forecast_only
calendar: false
existing_features: [resid, atmos, solar, tend]
arms: [past_wind, issued_atmosphere, past_wind_plus_issued_atmosphere]
models: [Timestral-209M, t0-gamma]
past_wind:
  version: 1
  fields: [u, v]
  units: m/s
  role: past_only
  cutoff: Valid time at or before each origin, matching the existing zero-delay platform replay.
  missing: Preserve masks; reject a wholly empty selected row.
issued_atmosphere:
  version: 1
  fields: [relative_humidity_2m, cloud_cover, shortwave_radiation]
  units: ['%', '%', W/m²]
  role: known_future
  history: Entire historical segment intentionally missing; this group contains future issued forecasts only.
  radiation: Backward one-hour mean at each hourly valid time; take exact three-hourly valid times without resampling or relabelling as instantaneous.
  endpoint: https://single-runs-api.open-meteo.com/v1/forecast
  product: meteofrance_arome_france
  source_run: Exact 03 UTC run selected by the frozen case.
  availability: Initialization plus three hours <= origin, a declared replay assumption, not certified publication evidence.
  extraction: Original frozen SYNOP coordinates, nearest grid point, elevation=nan; returned cell must match saved original AROME grid within 0.00001 degrees.
  decoder_audit: Fetch temperature and pressure as source checks; record differences from frozen anchors, requiring <=0.15 degC and <=0.15 hPa. Do not replace frozen anchors.
  missing: Refuse incomplete future inputs; never substitute another product or future observations.
native_translation:
  t0: Wind as additional jointly forecast context variates with outputs discarded; issued weather as future_covariates.
  clipping: false
  integer_snapping: false
  t0_trimming: false
  t0_symmetric_averaging: false
  Timestral: Wind as past_covariates; issued weather as known_covariates; existing pinned inference defaults.
metrics: Separate temperature/pressure MAE, RMSE, bias, pinball, coverage and widths; identical cases and pairs per comparison.
uncertainty: Descriptive only; too few independent time blocks for persuasive confidence intervals.
history_limit: Only 8-88 of 720 residual steps; not the dense-history hourly benchmark.
budget:
  global_cpu_cap_minutes: 60
  wave_cpu_cap_seconds: 600
  family_cpu_cap_seconds: 240
  preparation_and_reporting_cpu_seconds: 120
  download_cap_bytes: 2097152
  model_pilot_cases: 5
  concurrent_heavy_jobs: 1
  paid_resources: false
  new_checkpoints: false
